name: Laboratorio-Sonarqube

on:
  push:
    branches:
      - master

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for SonarQube analysis

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run Ruff
        run: ruff check . --output-format=json --output-file=ruff-report.json || true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.projectKey=riruizmoreno_Laboratorio-Sonarqube
            -Dsonar.organization=riruizmoreno
            -Dsonar.sourceEncoding=UTF-8
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}